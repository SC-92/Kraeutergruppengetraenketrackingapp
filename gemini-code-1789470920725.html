<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getränke Tracker (Pi Edition)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PocketBase SDK -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 max-w-md mx-auto">

  <!-- Header -->
  <header class="flex justify-between items-center mb-6 pt-2 border-b border-slate-700 pb-4">
    <div>
      <h1 class="text-xl font-bold text-amber-500">🍺 Pi-Getränke-Tracker</h1>
      <p class="text-xs text-slate-400">Host: Raspberry Pi Local</p>
    </div>
    <button onclick="changeUser()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg border border-slate-600">
      👤 Name ändern
    </button>
  </header>

  <!-- User & Deckel-Übersicht -->
  <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center border border-slate-700 mb-6">
    <div>
      <span class="text-xs text-slate-400">Aktueller Nutzer:</span>
      <h2 class="text-lg font-bold text-amber-400" id="current-user-display">-</h2>
    </div>
    <div class="text-right">
      <span class="text-xs text-slate-400">Deine Summe:</span>
      <div class="text-xl font-black text-green-400" id="my-total">0,00 €</div>
    </div>
  </div>

  <!-- Getränke-Buttons -->
  <section class="mb-6">
    <h3 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">Getränk buchen</h3>
    <div class="grid grid-cols-2 gap-3" id="drink-buttons">
      <!-- Werden live aus PocketBase geladen -->
    </div>
  </section>

  <!-- Live Gruppen-Deckel -->
  <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
    <h3 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">Live Gruppen-Deckel</h3>
    <div class="space-y-3" id="group-orders">
      <p class="text-xs text-slate-500">Lade Bestellungen...</p>
    </div>
  </section>

  <!-- PayPal Bezahlen -->
  <section class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-center">
    <a id="paypal-btn" href="#" target="_blank" class="block w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-lg text-sm transition">
      🅿️ Per PayPal begleichen
    </a>
  </section>

  <script>
    // IP deines Raspberry Pi hier anpassen
    const PI_IP = window.location.hostname || "192.168.178.50"; 
    const pb = new PocketBase(`http://${PI_IP}:8090`);

    const HOST_PAYPAL = "https://paypal.me/DeinName"; // Hier PayPal.me Link eintragen
    let currentUser = localStorage.getItem('tracker_user') || "";

    // Benutzer-Namensabfrage beim ersten Start
    function checkUser() {
      if (!currentUser) {
        currentUser = prompt("Bitte gib deinen Namen ein:") || "Gast";
        localStorage.setItem('tracker_user', currentUser);
      }
      document.getElementById('current-user-display').innerText = currentUser;
    }

    function changeUser() {
      localStorage.removeItem('tracker_user');
      currentUser = "";
      checkUser();
      loadOrders();
    }

    // Getränke aus PocketBase laden
    async function loadDrinks() {
      const drinks = await pb.collection('drinks').getFullList({ sort: 'price' });
      const container = document.getElementById('drink-buttons');
      container.innerHTML = "";

      drinks.forEach(drink => {
        container.innerHTML += `
          <button onclick="orderDrink('${drink.name}', ${drink.price})" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition p-3 rounded-xl border border-slate-700 flex flex-col items-center">
            <span class="text-3xl mb-1">${drink.icon || '🍺'}</span>
            <span class="font-semibold text-sm">${drink.name}</span>
            <span class="text-xs text-amber-400 font-bold">${drink.price.toFixed(2)} €</span>
          </button>
        `;
      });
    }

    // Getränk bestellen (in Datenbank schreiben)
    async function orderDrink(name, price) {
      await pb.collection('orders').create({
        user_name: currentUser,
        drink_name: name,
        price: price,
        paid: false
      });
    }

    // Live-Bestellungen laden & berechnen
    async function loadOrders() {
      const orders = await pb.collection('orders').getFullList({ filter: 'paid = false' });
      
      const userTotals = {};
      let myTotal = 0;

      orders.forEach(order => {
        userTotals[order.user_name] = (userTotals[order.user_name] || 0) + order.price;
        if (order.user_name === currentUser) {
          myTotal += order.price;
        }
      });

      // Eigene Summe aktualisieren
      document.getElementById('my-total').innerText = myTotal.toFixed(2) + " €";
      document.getElementById('paypal-btn').href = `${HOST_PAYPAL}/${myTotal.toFixed(2)}`;

      // Gruppen-Übersicht rendern
      const groupContainer = document.getElementById('group-orders');
      groupContainer.innerHTML = "";

      if (Object.keys(userTotals).length === 0) {
        groupContainer.innerHTML = `<p class="text-xs text-slate-500">Noch keine Getränke gebucht.</p>`;
        return;
      }

      for (const [user, total] of Object.entries(userTotals)) {
        const isMe = user === currentUser;
        groupContainer.innerHTML += `
          <div class="flex justify-between items-center text-sm ${isMe ? 'font-bold text-amber-400' : 'text-slate-300'}">
            <span>${user} ${isMe ? '(Du)' : ''}</span>
            <span>${total.toFixed(2)} €</span>
          </div>
        `;
      }
    }

    // Realtime-Subscription (Echtzeit-Updates für alle Geräte!)
    pb.collection('orders').subscribe('*', function (e) {
      loadOrders();
    });

    // Init
    checkUser();
    loadDrinks();
    loadOrders();
  </script>
</body>
</html>
